interface:
  display_name: "元素级图文动画 v0.1.0"
  short_description: "文案/配音 → 元素跟着讲解动起来的连续画面：文字、数字、时钟、流程、清单"
  default_prompt: "Use $element-motion-video to 把这段文案或配音做成元素级图文动画：先按节拍写 motion-plan（每拍先写要解释什么，再选动画、写承接），确认后用组件搭画面，跑 motion_logic_test 与 render_check 门禁，最后交付 MP4、联系表和门禁报告。"
policy:
  allow_implicit_invocation: true
